<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tailwind Example</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen">

  <!-- Pricing Card -->
  <div class="bg-white rounded-2xl shadow-xl p-8 w-80 border border-slate-200">
    
    <span class="bg-indigo-100 text-indigo-700 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">
      Pro
    </span>

    <h2 class="text-2xl font-bold text-slate-900 mt-4">Pro Plan</h2>
    
    <p class="text-slate-500 text-sm mt-1">For growing teams and businesses.</p>
    
    <div class="my-6">
      <span class="text-4xl font-extrabold text-slate-900">$29</span>
      <span class="text-slate-500 text-sm">/month</span>
    </div>

    <button class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg transition duration-200 shadow-md">
      Get Started
    </button>

  </div>

</body>
</html>
