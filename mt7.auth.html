<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MT7 - Sign In & Registration</title>
    <style>
        :root {
            --bg: #0b0f19;
            --panel: #131b2e;
            --panel-border: #1e293b;
            --text: #f1f5f9;
            --text-dim: #64748b;
            --primary: #10b981;
            --primary-hover: #059669;
            --danger: #f43f5e;
            --accent: #6366f1;
            --gold: #fbbf24;
            --card-bg: #162035;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 1rem;
        }

        .auth-container {
            width: 100%;
            max-width: 400px;
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 0.75rem;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            position: relative;
        }

        .auth-header {
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .auth-logo {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--text);
            letter-spacing: 1px;
        }

        .auth-logo span {
            color: var(--accent);
        }

        .auth-subtitle {
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        .tab-switcher {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 0.35rem;
            padding: 0.25rem;
            border: 1px solid var(--panel-border);
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-dim);
            padding: 0.5rem;
            border-radius: 0.25rem;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--accent);
            color: var(--text);
        }

        .auth-form {
            display: none;
            flex-direction: column;
            gap: 1rem;
        }

        .auth-form.active {
            display: flex;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .input-label {
            font-size: 0.7rem;
            color: var(--text-dim);
            text-transform: uppercase;
            font-weight: 600;
        }

        .auth-input {
            background: var(--bg);
            border: 1px solid var(--panel-border);
            color: var(--text);
            padding: 0.6rem 0.75rem;
            border-radius: 0.35rem;
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .auth-input:focus {
            border-color: var(--accent);
        }

        .auth-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.7rem;
            border-radius: 0.35rem;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            text-align: center;
            transition: background 0.2s;
            margin-top: 0.5rem;
        }

        .auth-btn:hover {
            background: var(--primary-hover);
        }

        .auth-error {
            font-size: 0.7rem;
            color: var(--danger);
            text-align: center;
            min-height: 1rem;
        }

        .demo-notice {
            font-size: 0.65rem;
            color: var(--text-dim);
            text-align: center;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-header">
            <div class="auth-logo">MT<span>7</span></div>
            <div class="auth-subtitle">Global Financial & Asset Trading Platform</div>
        </div>

        <div class="tab-switcher">
            <button class="tab-btn active" id="tab-login-btn" onclick="switchTab('login')">Sign In</button>
            <button class="tab-btn" id="tab-register-btn" onclick="switchTab('register')">Create Account</button>
        </div>

        <!-- LOGIN FORM -->
        <form class="auth-form active" id="login-form" onsubmit="handleLogin(event)">
            <div class="input-group">
                <label class="input-label">Email Address</label>
                <input type="email" id="login-email" class="auth-input" placeholder="trader@mt7.com" required />
            </div>
            <div class="input-group">
                <label class="input-label">Password</label>
                <input type="password" id="login-password" class="auth-input" placeholder="••••••••" required />
            </div>
            <div class="auth-error" id="login-error"></div>
            <button type="submit" class="auth-btn">Access Trading Terminal</button>
            <div class="demo-notice">Demo Mode: Any valid credentials or click Sign In directly to enter the terminal.</div>
        </form>

        <!-- REGISTER FORM -->
        <form class="auth-form" id="register-form" onsubmit="handleRegister(event)">
            <div class="input-group">
                <label class="input-label">Full Name</label>
                <input type="text" id="reg-name" class="auth-input" placeholder="John Doe" required />
            </div>
            <div class="input-group">
                <label class="input-label">Email Address</label>
                <input type="email" id="reg-email" class="auth-input" placeholder="trader@mt7.com" required />
            </div>
            <div class="input-group">
                <label class="input-label">Strong Password</label>
                <input type="password" id="reg-password" class="auth-input" placeholder="At least 6 characters" required minlength="6" />
            </div>
            <div class="auth-error" id="reg-error"></div>
            <button type="submit" class="auth-btn" style="background: var(--accent);">Register & Initialize Account</button>
            <div class="demo-notice">Secures $10,000 initial capital grant upon successful registration.</div>
        </form>
    </div>

    <script>
        function switchTab(tab) {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const loginBtn = document.getElementById('tab-login-btn');
            const registerBtn = document.getElementById('tab-register-btn');

            document.getElementById('login-error').textContent = '';
            document.getElementById('reg-error').textContent = '';

            if (tab === 'login') {
                loginForm.classList.add('active');
                registerForm.classList.remove('active');
                loginBtn.classList.add('active');
                registerBtn.classList.remove('active');
            } else {
                loginForm.classList.remove('active');
                registerForm.classList.add('active');
                loginBtn.classList.remove('active');
                registerBtn.classList.add('active');
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value.trim();

            if (!email || !password) {
                document.getElementById('login-error').textContent = 'Please fill in all required fields.';
                return;
            }

            // Save user session demo state
            localStorage.setItem('mt7_user', JSON.stringify({ email, name: email.split('@')[0] }));
            
            // Redirect to main trading terminal
            window.location.href = 'mt7.html';
        }

        function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value.trim();

            if (!name || !email || !password) {
                document.getElementById('reg-error').textContent = 'All fields are required.';
                return;
            }

            if (password.length < 6) {
                document.getElementById('reg-error').textContent = 'Password must be at least 6 characters long.';
                return;
            }

            // Save user session demo state
            localStorage.setItem('mt7_user', JSON.stringify({ name, email }));
            
            // Redirect to main trading terminal
            window.location.href = 'mt7.html';
        }
    </script>
</body>
</html>
